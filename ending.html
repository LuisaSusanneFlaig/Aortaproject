<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aorta Project - Conclusion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="ending-page">
    <nav class="navbar">
        <!-- No links to the dashboard: participants stay in the study flow. -->
        <span class="nav-logo">Aorta <span>Project</span></span>
        <div class="navbar-right">
            <button class="theme-toggle" type="button" aria-label="Toggle color scheme">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </nav>

    <main class="ending-main" aria-labelledby="ending-title">
        <section class="ending-outlooks">
            <p class="ending-kicker">TWO OUTLOOKS</p>
            <h1 id="ending-title">What the flow made visible</h1>
            <div class="ending-outlook-grid">
                <article class="ending-outlook">
                    <header>
                        <h3>Alex</h3>
                        <p class="ending-outlook-condition">Aortic aneurysm</p>
                    </header>
                    <p class="ending-outlook-flow" data-ending-flow="alex"></p>
                    <img class="ending-outlook-photo" src="assets/story_images/alex_doctor_talk_photoreal_v1.png" alt="Alex talks with a doctor about long-term aortic follow-up">
                </article>
                <article class="ending-outlook">
                    <header>
                        <h3>Miriam</h3>
                        <p class="ending-outlook-condition">Aortic dissection</p>
                    </header>
                    <p class="ending-outlook-flow" data-ending-flow="miriam"></p>
                    <img class="ending-outlook-photo" src="assets/story_images/miriam_consultation_photoreal_v1.png" alt="Miriam discusses long-term aortic follow-up with a physician">
                </article>
            </div>
            <p class="ending-outlook-summary" data-ending-summary></p>
        </section>
        <div class="ending-actions">
            <!-- To the final SoSci questionnaire (qnr4) with the case token: js/studyFlow.js. -->
            <a class="ending-action-primary" href="" data-sosci-return><strong>Continue to the final questions</strong><span aria-hidden="true">&rarr;</span></a>
        </div>
    </main>

    <footer class="overview-footer"><span>Aorta Project</span></footer>

    <!-- Outlook texts per flow version: js/stories/endingOutlooks.js -->
    <script type="module" src="js/ending.js"></script>
    <script>
        const themeToggle = document.querySelector('.theme-toggle');
        const applyTheme = () => document.body.classList.toggle('light-mode', localStorage.getItem('theme') === 'light');
        applyTheme();
        themeToggle?.addEventListener('click', () => {
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'dark' : 'light');
            applyTheme();
        });
    </script>
</body>
</html>
